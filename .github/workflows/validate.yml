name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate public catalog and skill structure
        run: python3 scripts/skills.py validate
      - name: Run repository tests
        run: python3 -m unittest discover -v -s tests -p 'test_*.py'
      - name: Run every catalogued skill test suite
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(".")
          for entry in json.loads((root / "catalog.json").read_text())["skills"]:
              scripts = root / entry["path"] / "scripts"
              if scripts.is_dir():
                  subprocess.run(
                      [sys.executable, "-m", "unittest", "discover", "-v", "-s", str(scripts), "-p", "test_*.py"],
                      check=True,
                  )
          PY
      - name: Scan repository for credential patterns
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path(".")
          text = "\n".join(
              path.read_text(errors="ignore")
              for path in root.rglob("*")
              if path.is_file() and ".git" not in path.parts
          )
          blocked = [
              "up" + r":yeah:",
              "OPENAI_" + r"API_KEY=",
              "OPENROUTER_" + r"API_KEY=",
              "gho_" + r"[A-Za-z0-9]",
              "sk-" + r"[A-Za-z0-9]{20,}",
          ]
          assert not any(re.search(pattern, text) for pattern in blocked)
          PY
      - name: Build every deterministic release archive
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(".")
          for entry in json.loads((root / "catalog.json").read_text())["skills"]:
              output = root / "dist" / f"{entry['name']}-v{entry['version']}.zip"
              result = subprocess.run(
                  [sys.executable, "scripts/build_skill_release.py", entry["path"], str(output)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              (output.with_suffix(".sha256")).write_text(result.stdout)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skill-release-candidates
          path: dist/
