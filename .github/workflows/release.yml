name: Release skill

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve and validate tagged skill
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/skills.py validate
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          marker = "-v"
          if marker not in tag:
              raise SystemExit(f"Invalid skill tag: {tag}")
          skill_name, version = tag.rsplit(marker, 1)
          entries = json.load(open("catalog.json"))["skills"]
          matches = [entry for entry in entries if entry["name"] == skill_name]
          if len(matches) != 1:
              raise SystemExit(f"Tag does not name a catalogued skill: {skill_name}")
          entry = matches[0]
          if entry["version"] != version:
              raise SystemExit(
                  f"Tag version {version} does not match catalog version {entry['version']}"
              )
          print(f"skill={skill_name}")
          print(f"path={entry['path']}")
          print(f"version={version}")
          print(f"display_name={entry['display_name']}")
          PY
      - name: Run tagged skill tests
        run: |
          scripts_dir="${{ steps.metadata.outputs.path }}/scripts"
          if [ -d "$scripts_dir" ]; then
            python3 -m unittest discover -v -s "$scripts_dir" -p 'test_*.py'
          fi
      - name: Build deterministic archive
        run: |
          mkdir -p dist
          output="dist/${{ steps.metadata.outputs.skill }}-v${{ steps.metadata.outputs.version }}.zip"
          python3 scripts/build_skill_release.py "${{ steps.metadata.outputs.path }}" "$output" | tee "${output%.zip}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "${{ steps.metadata.outputs.display_name }} v${{ steps.metadata.outputs.version }}"
