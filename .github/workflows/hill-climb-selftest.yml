name: Hill Climb self test

# The full self test needs the macOS sandbox (sandbox-exec) and takes several minutes,
# so it runs only when the skill or this workflow changes, or on demand.
on:
  pull_request:
    paths:
      - "hill-climb/**"
      - ".github/workflows/hill-climb-selftest.yml"
  push:
    branches: [main]
    paths:
      - "hill-climb/**"
      - ".github/workflows/hill-climb-selftest.yml"
  workflow_dispatch:

jobs:
  selftest:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the hill-climb checks, including the full self test
        env:
          HILL_CLIMB_FULL_SELFTEST: "1"
        run: python3 -m unittest discover -v -s hill-climb/scripts -p 'test_*.py'
